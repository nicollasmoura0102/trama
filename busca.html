<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" href="img/Trama-Ícone.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Inter:wght@400;600;700&display=swap"
    />
    <link rel="stylesheet" href="https://use.typekit.net/wtf4sxg.css" />
    <link rel="stylesheet" href="css/base.css" />
    <link rel="stylesheet" href="css/layout.css" />
    <link rel="stylesheet" href="css/components.css" />
    <title>Resultados da busca | Trama</title>
  </head>

  <body>
    <header id="topo">
      <div class="topo__barra">
        <a class="logo" href="index.html">
          <img
            class="logo__imagem"
            src="img/Trama-Logotipo.svg"
            alt="Trama, página inicial"
          />
        </a>

        <form class="busca" id="form-busca" role="search" action="#">
          <label class="visualmente-oculto" for="busca">Buscar produtos</label>
          <input
            class="busca__entrada"
            type="search"
            id="busca"
            name="q"
            placeholder="Buscar roupas, marcas e mais"
          />
          <button class="busca__botao" type="submit" aria-label="Buscar">
            <svg class="icone" viewBox="0 0 24 24" aria-hidden="true">
              <circle cx="11" cy="11" r="6" />
              <path d="M16 16l5 5" />
            </svg>
          </button>
        </form>

        <div class="topo__acoes">
          <a class="botao-icone" href="#" aria-label="Meus favoritos">
            <svg class="icone" viewBox="0 0 24 24" aria-hidden="true">
              <path
                d="M12 21s-8-5-8-11a4.5 4.5 0 0 1 8-2.8A4.5 4.5 0 0 1 20 10c0 6-8 11-8 11z"
              />
            </svg>
          </a>
          <a
            class="botao-icone"
            href="login.html"
            aria-label="Entrar na minha conta"
          >
            <svg class="icone" viewBox="0 0 24 24" aria-hidden="true">
              <circle cx="12" cy="8" r="4" />
              <path d="M4 21c0-4 4-6 8-6s8 2 8 6" />
            </svg>
          </a>
          <a class="botao-icone" id="link-sacola" href="#form-compra" aria-label="Minha sacola">
            <svg class="icone" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M3 4h2l2.5 11h10L20 8H6.5" />
              <circle cx="9" cy="20" r="1.5" />
              <circle cx="17" cy="20" r="1.5" />
            </svg>
            <span class="sacola__contador" id="contador-sacola" hidden></span>
          </a>
        </div>
      </div>

      <nav class="menu" aria-label="Categorias">
        <ul class="menu__lista">
          <li><a class="menu__link" href="busca.html?ordem=novidades">Novidades</a></li>
          <li><a class="menu__link" href="busca.html">Feminino</a></li>
          <li><a class="menu__link" href="busca.html">Masculino</a></li>
          <li><a class="menu__link" href="busca.html">Infantil</a></li>
          <li><a class="menu__link" href="busca.html?categoria=Camisetas">Camisetas</a></li>
          <li><a class="menu__link" href="busca.html?categoria=Cal%C3%A7as">Calças</a></li>
          <li><a class="menu__link" href="busca.html?categoria=Jaquetas">Jaquetas</a></li>
          <li><a class="menu__link" href="busca.html?categoria=Acess%C3%B3rios">Acessórios</a></li>
          <li><a class="menu__link" href="busca.html?ordem=menor-preco">Promoções</a></li>
        </ul>
      </nav>
    </header>

    <main class="busca-pagina pagina-clara">
      <div class="busca-pagina__filtros">
        <button class="botao botao--claro filtros-toggle" id="alternar-filtros" type="button" aria-expanded="false" aria-controls="painel-filtros">
          Filtros
          <span class="filtros-toggle__contagem" id="filtros-contagem" hidden></span>
        </button>

        <aside class="filtros-painel" id="painel-filtros" aria-labelledby="titulo-filtros">
          <p class="filtros-painel__titulo" id="titulo-filtros">Filtros</p>
          <div id="lista-grupos"></div>
          <button class="link-botao" id="limpar-filtros" type="button">Limpar filtros</button>
        </aside>
      </div>

      <section class="busca-pagina__resultados" aria-labelledby="titulo-resultados">
        <div class="busca-barra">
          <form class="busca-barra__campo" id="form-busca-pagina" role="search" action="#">
            <label class="visualmente-oculto" for="campo-busca">Buscar produtos</label>
            <input class="busca-barra__entrada" id="campo-busca" name="q" type="search" placeholder="Busque produtos, marcas ou categorias" autocomplete="off" />
            <button class="busca-barra__botao" type="submit" aria-label="Buscar">
              <svg class="icone" viewBox="0 0 24 24" aria-hidden="true">
                <circle cx="11" cy="11" r="6" />
                <path d="M16 16l5 5" />
              </svg>
            </button>
          </form>

          <div class="ordenar">
            <label class="visualmente-oculto" for="ordenar">Ordenar por</label>
            <select class="ordenar__select" id="ordenar" name="ordem">
              <option value="relevancia">Ordenar por: relevância</option>
              <option value="menor-preco">Menor preço</option>
              <option value="maior-preco">Maior preço</option>
              <option value="mais-avaliados">Mais avaliados</option>
              <option value="novidades">Novidades</option>
            </select>
          </div>
        </div>

        <div class="resultados__cabecalho">
          <h1 class="resultados__titulo" id="titulo-resultados" tabindex="-1">Resultados para você</h1>
          <p class="resultados__contagem" id="contagem" role="status"></p>
        </div>

        <div class="chips" id="lista-chips" role="group" aria-label="Filtros aplicados" hidden></div>

        <ul class="resultados__grade" id="grade-resultados"></ul>

        <div class="resultados__vazio" id="resultados-vazio" hidden>
          <p>Nenhum produto encontrado com esses filtros.</p>
          <button class="botao botao--escuro" id="limpar-vazio" type="button">Limpar filtros</button>
        </div>

        <div class="resultados__mais" id="area-ver-mais" hidden>
          <button class="botao botao--escuro" id="ver-mais" type="button">Ver mais produtos</button>
        </div>
      </section>
    </main>

    <a class="voltar-topo" href="#topo" aria-label="Voltar ao topo da página">
      <svg class="icone" viewBox="0 0 24 24" aria-hidden="true">
        <path d="M12 19V5M6 11l6-6 6 6" />
      </svg>
    </a>

    <template id="modelo-grupo">
      <details class="filtro-grupo" open>
        <summary class="filtro-grupo__titulo">
          <span class="filtro-grupo__nome"></span>
          <span class="filtro-grupo__seta" aria-hidden="true">
            <svg class="icone" viewBox="0 0 24 24"><path d="M6 9l6 6 6-6" /></svg>
          </span>
        </summary>
        <ul class="filtro-grupo__opcoes"></ul>
      </details>
    </template>

    <template id="modelo-opcao">
      <li>
        <label class="opcao">
          <input class="opcao__entrada" type="checkbox" />
          <span class="opcao__cor" aria-hidden="true" hidden></span>
          <span class="opcao__rotulo"></span>
        </label>
      </li>
    </template>

    <template id="modelo-resultado">
      <li>
        <article class="resultado">
          <div class="resultado__imagem" aria-hidden="true"></div>
          <button class="botao-icone produto__favorito" type="button" aria-pressed="false">
            <svg class="icone" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M12 21s-8-5-8-11a4.5 4.5 0 0 1 8-2.8A4.5 4.5 0 0 1 20 10c0 6-8 11-8 11z" />
            </svg>
          </button>
          <div class="resultado__info">
            <h2 class="resultado__nome"></h2>
            <p class="resultado__detalhe"></p>
            <div class="resultado__rodape">
              <p class="resultado__preco"></p>
              <a class="botao botao--claro botao--pequeno resultado__link" href="produto.html">Ver produto</a>
            </div>
          </div>
        </article>
      </li>
    </template>

    <p class="visualmente-oculto" id="aviso" role="status"></p>

    <script src="js/busca.js" defer></script>
  </body>
</html>
